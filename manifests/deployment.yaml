apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: github-actions-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: github-runner
      terminationGracePeriodSeconds: 30
      containers:
        - name: runner
          image: partofaplan/github-actions-runner-java:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "/runner/runner-entrypoint.sh"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
          env:
            - name: GITHUB_OWNER
              value: "partofaplan"
            - name: GITHUB_REPOSITORY
              value: "sample-java-application"
            - name: RUNNER_LABELS
              value: "self-hosted,kubernetes,local,alpha"
            - name: RUNNER_ALLOW_RUNASROOT
              value: "1"
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: GITHUB_PAT
          volumeMounts:
            - name: runner-scripts
              mountPath: /runner/runner-entrypoint.sh
              subPath: runner-entrypoint.sh
            - name: runner-work
              mountPath: /actions-runner/_work
            - name: host-docker-sock
              mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: runner-scripts
          configMap:
            name: github-runner-scripts
            defaultMode: 0755
        - name: runner-work
          emptyDir: {}
        - name: host-docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
