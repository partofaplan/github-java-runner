apiVersion: v1
kind: ConfigMap
metadata:
  name: github-runner-scripts
  namespace: github-actions-runner
data:
  runner-entrypoint.sh: |
    #!/usr/bin/env bash

    set -euo pipefail

    if [[ -n "${RUNNER_DEBUG:-}" ]]; then
      set -x
    fi

    log() {
      echo "[$(date --iso-8601=seconds)] $*" >&2
    }

    require_env() {
      local name="$1"
      if [[ -z "${!name:-}" ]]; then
        log "ERROR: Environment variable ${name} is required but not set."
        exit 1
      fi
    }

    require_env "GITHUB_OWNER"
    require_env "GITHUB_PAT"

    SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"
    API_URL="${GITHUB_API_URL:-https://api.github.com}"

    SERVER_URL="${SERVER_URL%/}"
    API_URL="${API_URL%/}"

    TARGET_URL=""
    SCOPE_PATH=""
    if [[ -n "${GITHUB_REPOSITORY:-}" ]]; then
      SCOPE_PATH="repos/${GITHUB_OWNER}/${GITHUB_REPOSITORY}"
      SCOPE_DESC="repository ${GITHUB_OWNER}/${GITHUB_REPOSITORY}"
      TARGET_URL="${SERVER_URL}/${GITHUB_OWNER}/${GITHUB_REPOSITORY}"
    else
      SCOPE_PATH="orgs/${GITHUB_OWNER}"
      SCOPE_DESC="organization ${GITHUB_OWNER}"
      TARGET_URL="${SERVER_URL}/${GITHUB_OWNER}"
    fi

    RUNNER_NAME="${RUNNER_NAME:-${HOSTNAME}}"
    RUNNER_WORKDIR="${RUNNER_WORKDIR:-_work}"
    RUNNER_LABELS="${RUNNER_LABELS:-self-hosted,kubernetes}"

    github_api() {
      local method="$1"
      local path="$2"
      shift 2
      local response body status
      response="$(curl -sSLw '\n%{http_code}' -X "${method}" \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${GITHUB_PAT}" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "${API_URL}/${path}" "$@")"
      body="$(printf '%s' "${response}" | sed '$d')"
      status="$(printf '%s' "${response}" | tail -n 1)"
      if ! [[ "${status}" =~ ^[0-9]+$ ]]; then
        log "ERROR: Unable to parse GitHub API status from response: ${response}"
        return 1
      fi
      if (( status < 200 || status >= 300 )); then
        log "ERROR: GitHub API ${method} ${path} returned HTTP ${status}"
        log "Response body: ${body}"
        return 1
      fi
      printf '%s' "${body}"
    }

    fetch_token() {
      local action="$1" # registration-token or remove-token
      local json token
      if ! json="$(github_api POST "${SCOPE_PATH}/actions/runners/${action}")"; then
        log "ERROR: Failed to request ${action} for ${SCOPE_DESC}"
        return 1
      fi
      log "GitHub API body for ${action}: ${json}"
      if ! token="$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("token",""), end="")' <<<"${json}")"; then
        log "ERROR: Response did not contain token: ${json}"
        return 1
      fi
      printf '%s' "${token}"
    }

    sanitize_token() {
      # Remove newlines or carriage returns to keep tokens shell-safe.
      local token="$1"
      token="${token//$'\r'/}"
      token="${token//$'\n'/}"
      printf '%s' "${token}"
    }

    log "Requesting short-lived registration token for ${SCOPE_DESC}…"
    if ! REG_TOKEN_RAW="$(fetch_token registration-token)"; then
      log "ERROR: Registration token response did not contain a token."
      exit 1
    fi

    log "Registration token raw (b64): $(printf '%s' "${REG_TOKEN_RAW}" | base64)"

    REG_TOKEN="$(sanitize_token "${REG_TOKEN_RAW}")"
    if [[ -z "${REG_TOKEN}" ]]; then
      log "ERROR: Registration token was empty after sanitization."
      exit 1
    fi
    log "Received registration token (prefix: ${REG_TOKEN:0:4}***)."

    cleanup() {
      log "Runner shutdown requested. Attempting deregistration…"
      if [[ "${RUNNER_CONFIGURED:-false}" != "true" ]]; then
        log "Runner was not fully configured; skipping deregistration."
        return
      fi
      if REMOVE_TOKEN_RAW="$(fetch_token remove-token)"; then
        REMOVE_TOKEN="$(sanitize_token "${REMOVE_TOKEN_RAW}")"
        if [[ -n "${REMOVE_TOKEN}" ]]; then
          ./config.sh remove --token "${REMOVE_TOKEN}" || true
          log "Runner deregistered from ${SCOPE_DESC}"
        else
          log "WARNING: Removal token empty after sanitization; skipping deregistration."
        fi
      else
        log "WARNING: Failed to obtain removal token; runner may remain registered."
      fi
    }

    trap cleanup EXIT INT TERM

    log "Configuring runner ${RUNNER_NAME} in workdir ${RUNNER_WORKDIR} with labels ${RUNNER_LABELS}"

    ./config.sh \
      --url "${TARGET_URL}" \
      --token "${REG_TOKEN}" \
      --name "${RUNNER_NAME}" \
      --labels "${RUNNER_LABELS}" \
      --work "${RUNNER_WORKDIR}" \
      --unattended \
      --replace

    RUNNER_CONFIGURED=true

    log "Runner configuration complete; starting listener…"
    exec ./run.sh
